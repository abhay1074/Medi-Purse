{% extends "base.html" %}
{% block title %}{{ 'Edit staff' if s else 'Add staff' }}{% endblock %}
{% block content %}
<div class="muted small"><a href="/staff">Staff accounts</a> ›</div>
<h1>{{ 'Edit ' ~ s.name if s else 'Add a staff account' }}</h1>
<form method="post" class="stack">
  <div class="row">
    <div class="field"><label>Full name *</label><input name="name" required value="{{ s.name if s else '' }}"></div>
    <div class="field"><label>Email (sign-in) *</label><input name="email" type="email" {{ 'disabled' if s else 'required' }} value="{{ s.email if s else '' }}"></div>
  </div>
  <div class="row">
    <div class="field"><label>Role *</label>
      <select name="role" {{ 'disabled' if s and s.id == user.id }}>
        {% for k, v in ROLES.items() %}<option value="{{ k }}" {{ 'selected' if s and s.role == k }}>{{ v }}</option>{% endfor %}
      </select></div>
    <div class="field"><label>Clinic (for doctors and receptionists)</label>
      <select name="clinic_id"><option value="">—</option>
        {% for c in clinics %}<option value="{{ c.id }}" {{ 'selected' if (s and s.clinic_id == c.id) or clinic_id == c.id }}>{{ c.label }}</option>{% endfor %}
      </select></div>
  </div>
  <div class="field"><label>Specialty / title</label><input name="specialty" placeholder="e.g. Neurologist" value="{{ s.specialty if s else '' }}"></div>
  <div class="field"><label>{{ 'New password (leave blank to keep)' if s else 'Password * (min 6 characters)' }}</label>
    <input name="password" type="password" {{ '' if s else 'required minlength=6' }}></div>
  {% if s and s.id != user.id %}
  <div class="field"><label><input type="checkbox" name="active" {{ 'checked' if s.active }}> Account active (can sign in)</label></div>
  {% endif %}
  <div class="actions"><button class="btn primary">{{ 'Save' if s else 'Create account' }}</button><a class="btn" href="/staff">Cancel</a></div>
</form>
{% endblock %}
