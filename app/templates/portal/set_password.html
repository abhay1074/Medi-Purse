{% extends "portal/base.html" %}
{% block title %}Set password{% endblock %}
{% block content %}
<div class="login">
  <h1>Hello, {{ who.first_name }}</h1>
  <p class="muted">Choose a password for your {{ who.clinic.name }} patient account.</p>
  <form method="post" class="card">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="field"><label>Email</label><input value="{{ who.email }}" disabled></div>
    <div class="field"><label>New password</label><input type="password" name="password" minlength="8" required autofocus placeholder="At least 8 characters"></div>
    <div class="field"><label>Confirm password</label><input type="password" name="password2" minlength="8" required></div>
    <button class="btn primary block">Save password</button>
  </form>
</div>
{% endblock %}
