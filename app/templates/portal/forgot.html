{% extends "portal/base.html" %}
{% block title %}Set password{% endblock %}
{% block content %}
<div class="login">
  <h1>Set or reset your password</h1>
  <p class="muted">Enter the email the clinic has for you. We'll send a link to set your password.</p>
  <form method="post" class="card">
    <div class="field"><label>Email</label><input name="email" type="email" required autofocus></div>
    <button class="btn primary block">Email me a link</button>
  </form>
  <p class="muted"><a href="/portal/login">Back to sign in</a></p>
</div>
{% endblock %}
