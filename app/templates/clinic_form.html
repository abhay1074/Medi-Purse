{% extends "base.html" %}
{% block title %}{{ 'Edit clinic' if c else 'Register clinic' }}{% endblock %}
{% block content %}
<div class="crumbs"><a href="/clinics">Clinics</a> › {{ 'Edit' if c else 'New clinic' }}</div>
<h1>{{ 'Edit ' ~ c.name if c else 'Register a clinic' }}</h1>
<form method="post" class="stack">
  <div class="field"><label>Clinic name *</label><input name="name" required value="{{ c.name if c else '' }}"></div>
  <div class="field"><label>Hospital</label>
    <select name="hospital_id">
      <option value="">Independent clinic (no hospital)</option>
      {% for h in hospitals %}<option value="{{ h.id }}" {{ 'selected' if (c and c.hospital_id == h.id) or (hospital_id == h.id) }}>{{ h.name }}</option>{% endfor %}
    </select></div>
  <div class="field"><label>Specialty</label><input name="specialty" placeholder="e.g. Neurology, General practice" value="{{ c.specialty if c else '' }}"></div>
  <div class="field"><label>Location / address</label><input name="address" value="{{ c.address if c else '' }}"></div>
  <div class="field"><label>Phone</label><input name="phone" value="{{ c.phone if c else '' }}"></div>
  <div class="actions"><button class="btn primary">{{ 'Save' if c else 'Register clinic' }}</button>
  <a class="btn outline" href="{{ '/clinics/' ~ c.id if c else '/clinics' }}">Cancel</a></div>
</form>
{% endblock %}
