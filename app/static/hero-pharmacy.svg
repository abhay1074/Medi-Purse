<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fae8ff"/><stop offset=".5" stop-color="#e9d5ff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <radialGradient id="glow" cx=".75" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="capA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="capB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="bottle2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#glow)"/>
  <!-- shelves -->
  <g>
    <rect x="1010" y="250" width="520" height="16" rx="8" fill="url(#shelf)"/>
    <rect x="1010" y="470" width="520" height="16" rx="8" fill="url(#shelf)"/>
    <!-- top shelf bottles -->
    <g transform="translate(1040 120)"><rect x="10" y="0" width="60" height="24" rx="6" fill="#fff"/><rect y="20" width="80" height="110" rx="16" fill="url(#bottle)"/><rect x="12" y="55" width="56" height="40" rx="6" fill="#fff" opacity=".9"/><path d="M40 62v26M27 75h26" stroke="#d97706" stroke-width="6" stroke-linecap="round"/></g>
    <g transform="translate(1150 150)"><rect x="8" y="0" width="44" height="20" rx="5" fill="#fff"/><rect y="16" width="60" height="84" rx="12" fill="url(#bottle2)"/><rect x="10" y="44" width="40" height="28" rx="5" fill="#fff" opacity=".9"/></g>
    <g transform="translate(1240 110)"><rect x="12" y="0" width="66" height="26" rx="6" fill="#fff"/><rect y="22" width="90" height="118" rx="18" fill="url(#capA)" opacity=".9"/><rect x="14" y="60" width="62" height="42" rx="6" fill="#fff" opacity=".9"/></g>
    <g transform="translate(1360 160)"><rect y="0" width="120" height="90" rx="10" fill="#fff" opacity=".95"/><rect x="10" y="12" width="100" height="16" rx="4" fill="#c4b5fd"/><rect x="10" y="38" width="70" height="10" rx="4" fill="#e9d5ff"/><rect x="10" y="56" width="84" height="10" rx="4" fill="#e9d5ff"/></g>
    <!-- lower shelf boxes -->
    <g transform="translate(1040 360)"><rect width="140" height="110" rx="12" fill="#fff" opacity=".95"/><rect x="14" y="16" width="70" height="14" rx="4" fill="#f9a8d4"/><path d="M110 50v34M93 67h34" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/></g>
    <g transform="translate(1200 330)"><rect x="8" y="0" width="52" height="22" rx="6" fill="#fff"/><rect y="18" width="68" height="122" rx="14" fill="url(#bottle2)"/></g>
    <g transform="translate(1290 380)"><rect width="200" height="90" rx="12" fill="#fff" opacity=".9"/>
      <g fill="#fbcfe8"><circle cx="30" cy="30" r="13"/><circle cx="70" cy="30" r="13"/><circle cx="110" cy="30" r="13"/><circle cx="150" cy="30" r="13"/><circle cx="30" cy="62" r="13"/><circle cx="70" cy="62" r="13"/></g>
      <g fill="#a78bfa"><circle cx="110" cy="62" r="13"/><circle cx="150" cy="62" r="13"/></g></g>
  </g>
  <!-- floating capsules and tablets -->
  <g transform="rotate(-30 980 560)"><rect x="900" y="535" width="170" height="56" rx="28" fill="#fff"/><path d="M985 535h57a28 28 0 0 1 0 56h-57z" fill="url(#capA)"/></g>
  <g transform="rotate(24 1500 600)"><rect x="1440" y="580" width="130" height="44" rx="22" fill="#fff"/><path d="M1505 580h43a22 22 0 0 1 0 44h-43z" fill="url(#capB)"/></g>
  <circle cx="1560" cy="110" r="34" fill="#fff"/><path d="M1536 110h48" stroke="#ddd6fe" stroke-width="6" stroke-linecap="round"/>
  <circle cx="950" cy="140" r="26" fill="#fde68a"/><path d="M932 140h36" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1120" cy="620" r="20" fill="#fff" opacity=".9"/>
  <circle cx="1600" cy="380" r="140" fill="#c084fc" opacity=".18"/>
</svg>
