  <path d="M0 640 H330 l24 -60 l30 140 l28 -190 l26 150 l18 -40 H760 l20 -36 l22 70 l18 -34 H1200" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3" stroke-linejoin="round"/>
