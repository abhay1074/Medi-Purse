<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <pattern id="crosses" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M32 26v12M26 32h12" stroke="#fff" stroke-opacity=".07" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <radialGradient id="glow1" cx=".85" cy=".15" r=".5"><stop offset="0" stop-color="#5eead4" stop-opacity=".45"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".1" cy=".9" r=".55"><stop offset="0" stop-color="#93c5fd" stop-opacity=".35"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow1)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>
  <rect width="1200" height="900" fill="url(#crosses)"/>
