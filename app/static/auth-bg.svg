  <path d="M0 830 C 260 790 460 880 720 840 S 1040 780 1200 820 V900 H0 Z" fill="#fff" fill-opacity=".07"/>
  <circle cx="1040" cy="170" r="120" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1040" cy="170" r="180" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>
</svg>
